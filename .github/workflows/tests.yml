name: Portfolio service
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORTFOLIO_TEST_DATABASE_URL: postgresql+psycopg://portfolio:ci-only-password@127.0.0.1:5432/portfolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: ruff check portfolio tests tools
      - run: ruff format --check portfolio tests tools
      - run: python -m pytest -q
      - run: python tools/demo.py
      - run: docker compose config --quiet
        env:
          PORTFOLIO_DB_PASSWORD: ci-only-password
      - run: docker build -t property-portfolio:test .
      - name: Verify packaged application and migrations in the image
        run: docker run --rm -e PORTFOLIO_DATABASE_URL=sqlite:////tmp/check.db property-portfolio:test portfolio migrate

